<app-tracker-card [id]="type()" [title]="'items.types.'+type() | transloco" [icon]="'assets/img/icons/'+type()+'.png'"
  [progress]="[mastered() / items().length]">
  <span counter>{{mastered()}}/{{items().length}}</span>
  <ul class="check-list">
    @for (row of rows(); track row.item.name) {
      <li class="check-row" [class.done]="row.item.mastered" [attr.data-rarity]="row.rarity">
        <button type="button" class="check-main" [attr.aria-pressed]="row.item.mastered" (click)="toggle(row.item)">
          <span class="material-symbols-outlined check-status" aria-hidden="true">
            {{row.item.mastered ? 'check_circle' : 'radio_button_unchecked'}}
          </span>
          <span class="check-name">{{row.item.name}}</span>
          <small class="check-meta" [title]="'items.mr_needed' | transloco">MR {{row.item.mastery_requirement}}</small>
        </button>
        <a class="check-side check-link" [href]="row.item.wiki" target="_blank" rel="noopener" [title]="'Wiki: ' + row.item.name">
          <span class="material-symbols-outlined icon-md" aria-hidden="true">open_in_new</span>
        </a>
      </li>
    }
  </ul>
</app-tracker-card>
