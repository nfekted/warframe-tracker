<app-tracker-card [id]="group()" [title]="'incarnon.'+group() | transloco">
  <span class="card-heading" counter>{{acquired()}}/{{incarnons().length}}</span>
  @for (item of incarnons(); track item.name) {
    <div class="col-12 mt-2">
      <div class="btn-group w" role="group">
        <button class="btn btn-sm btn-primary btn-item w"
          [class.mastered]="item.acquired" [class.prime]="item.acquired"
          (click)="store.toggleIncarnon(item.name)">
          <img [src]="'assets/img/incarnon/'+(item.name.toLowerCase())+'.png'" /><br />
          {{item.name | uppercase}}
        </button>
        <a class="btn btn-primary btn-item" [href]="item.wiki" target="_blank" rel="noopener" [class.mastered]="item.acquired">
          <span class="material-symbols-outlined">
            open_in_new
          </span>
        </a>
      </div>
    </div>
  }
</app-tracker-card>
