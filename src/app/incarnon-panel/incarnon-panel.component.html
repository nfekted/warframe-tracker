<div class="row page">
  <div class="col-12 mt-4">
    <h3>{{'incarnon.description' | transloco}}</h3>
  </div>
  <div class="col-12 mt-2">
    <small>{{'on_update' | transloco}}: {{gameUpdate.name}} ({{gameUpdate.date}})</small>
  </div>
  <hr class="mt-4" />
  <div class="row">
    @for (group of groups(); track group[0]) {
      <div class="col-12 col-md-6 col-xl-4 mt-4">
        <app-incarnon [group]="group[0]" [incarnons]="group[1]"></app-incarnon>
      </div>
    }
  </div>
</div>
