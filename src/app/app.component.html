<app-sidebar></app-sidebar>
<app-dialog></app-dialog>
<div class="container-fluid">
  <div class="row">
    <div class="col-12 mt-5">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
<div class="btn-group" id="language">
  <button class="btn btn-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown"
    aria-expanded="false" [title]="'language' | transloco">
    <img [src]="'assets/img/' + store.lang() + 'flag.png'" width="55" [alt]="store.lang() == 'pt' ? 'Português' : 'English'" />
  </button>
  <ul class="dropdown-menu">
    <li>
      <button type="button" class="dropdown-item" (click)="changeLang('en')" lang="en">
        <img src="assets/img/enflag.png" width="55" alt="English" />
      </button>
    </li>
    <li>
      <button type="button" class="dropdown-item" (click)="changeLang('pt')" lang="pt">
        <img src="assets/img/ptflag.png" width="55" alt="Português" />
      </button>
    </li>
  </ul>
</div>
<button id="myBtn" type="button" [title]="'go_to_top' | transloco" [attr.aria-label]="'go_to_top' | transloco"
  class="btn btn-sm btn-info" (click)="scrollToTop()">
  <span class="material-symbols-outlined" aria-hidden="true">
    arrow_circle_up
  </span>
</button>
