<app-sidebar></app-sidebar>
<app-dialog></app-dialog>
<div class="container-fluid">
  <div class="row">
    <div class="col-12 mt-5">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
<div class="btn-group" id="language">
  <button class="btn btn-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown"
    aria-expanded="false">
    <img [src]="'assets/img/' + store.lang() + 'flag.png'" width="55" />
  </button>
  <ul class="dropdown-menu">
    <li>
      <img class="dropdown-item" [src]="'assets/img/enflag.png'" width="55" (click)="changeLang('en')" />
    </li>
    <li>
      <img class="dropdown-item" [src]="'assets/img/ptflag.png'" width="55" (click)="changeLang('pt')" />
    </li>
  </ul>
</div>
<button id="myBtn" [title]="'go_to_top' | transloco" class="btn btn-sm btn-info" (click)="scrollToTop()">
  <span class="material-symbols-outlined">
    arrow_circle_up
  </span>
</button>
