<div class="row page">
  <div class="col-12">
    <div class="row">
      <div class="col-12">
        <h5>{{'planets.options' | transloco}}</h5>
      </div>

      <!-- Hide mastered -->
      <div class="col-12">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="hideComplete"
            [checked]="hideComplete()" (change)="hideComplete.set($any($event.target).checked)">
          <label class="form-check-label" for="hideComplete">{{'planets.hide' | transloco}}</label>
        </div>
      </div>
    </div>
  </div>
      <div class="col-12 mt-2">
        <small>{{'on_update' | transloco}}: {{gameUpdate.name}} ({{gameUpdate.date}})</small>
      </div>
      <hr class="mt-4" />
      @for (group of planets(); track group.planet) {
        <div class="col-12 col-md-6 col-xl-4 col-xxl-3 mt-4">
          <app-star-chart [planet]="group.planet" [locations]="group.locations" [visible]="group.visible"></app-star-chart>
        </div>
      } @empty {
        <!-- Only reachable with every location complete and hidden -->
        <div class="col-12 empty">
          <p>{{'planets.all_complete' | transloco}}</p>
          <button type="button" class="btn btn-primary" (click)="hideComplete.set(false)">{{'planets.show_complete' | transloco}}</button>
        </div>
      }
    </div>
