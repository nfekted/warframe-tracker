<div class="row items">
  <div class="col-12">
    <div class="row">
      <div class="col-12">
        <h5>{{'planets.options' | transloco}}</h5>
      </div>

      <!-- Hide mastered -->
      <div class="col-12 col-md-3">
        <div class="row">
          <div class="col-12 text-center">
            {{'planets.hide' | transloco}}
          </div>
          <div class="col-12 text-center">
            <div class="btn-group" role="group" aria-label="Show or Hide complete">
              <input type="radio" class="btn-check" name="hideComplete" id="showMastered"
                autocomplete="off" (change)="hideComplete = true">
                <label class="btn btn-option btn-toggle" for="showMastered">
                  <span class="material-symbols-outlined">
                    check
                  </span>
                </label>

                <input type="radio" class="btn-check" name="hideComplete" id="hideComplete"
                  autocomplete="off" (change)="hideComplete = false" checked>
                  <label class="btn btn-option btn-toggle" for="hideComplete">
                    <span class="material-symbols-outlined">
                      close
                    </span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 mt-2">
        <small>{{'on_update' | transloco}}: {{gameUpdate.name}} ({{gameUpdate.date}})</small>
      </div>
      <hr class="mt-4" />
      @for (item of locations; track item) {
        @if (showCategory(item)) {
          <div class="col-12 col-md-3">
            <app-star-chart [image]="item" [locations]="store.account().locations"
            [hideComplete]="hideComplete"></app-star-chart>
          </div>
        }
      }
    </div>
