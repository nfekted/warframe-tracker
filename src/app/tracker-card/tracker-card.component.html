<div class="row text-center mt-5">
  <div class="col-12">
    @if (icon()) {
      <img [src]="icon()" width="50" />&nbsp;
    }
    <span style="font-size: 25px;">{{title()}}</span><br />
    <ng-content select="[counter]" />
  </div>
  <div class="col-12">
    <div class="btn-group" role="group" [attr.aria-label]="'Show or Hide ' + id()">
      <input type="radio" class="btn-check" [name]="id()" [id]="'show'+id()" autocomplete="off"
        (change)="show.set(true)" [checked]="show()">
      <label class="btn btn-option btn-toggle" [for]="'show'+id()">
        <span class="material-symbols-outlined">
          check
        </span>
      </label>

      <input type="radio" class="btn-check" [name]="id()" [id]="'hide'+id()" autocomplete="off"
        (change)="show.set(false)" [checked]="!show()">
      <label class="btn btn-option btn-toggle" [for]="'hide'+id()">
        <span class="material-symbols-outlined">
          close
        </span>
      </label>
    </div>
  </div>
  <!-- ITEMS -->
  <div class="col-12" [hidden]="!show()">
    <div class="row">
      <ng-content />
    </div>
  </div>
</div>
