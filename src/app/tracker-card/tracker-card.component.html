<button type="button" class="card-toggle" [attr.aria-expanded]="show()" [attr.aria-controls]="'list-' + id()"
  (click)="show.set(!show())">
  <span class="card-title-row">
    @if (icon()) {
      <img [src]="icon()" width="40" height="40" alt="" />
    }
    <span class="card-title">{{title()}}</span>
    <span class="material-symbols-outlined chevron" aria-hidden="true">expand_more</span>
  </span>
  <span class="card-counter"><ng-content select="[counter]" /></span>
  @for (value of progress(); track $index) {
    <span class="card-bar"><span class="card-bar-fill" [style.width.%]="value * 100"></span></span>
  }
</button>
<div [id]="'list-' + id()" [hidden]="!show()">
  <div class="row">
    <ng-content />
  </div>
</div>
